// Минимальная копия стандартного grpc.health.v1 (только Check): полноценный
// grpc-services тянет полный protobuf, который конфликтует с lite-версией на Android.
syntax = "proto3";

package grpc.health.v1;

option java_package = "com.example.grpcproxytester.health";
option java_multiple_files = true;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
